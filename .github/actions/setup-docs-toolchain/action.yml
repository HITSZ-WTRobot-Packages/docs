name: Setup documentation toolchain
description: Install the pinned Bun dependencies with a shared package cache and optional Chromium.

inputs:
  playwright:
    description: Install Chromium and its operating-system dependencies.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - name: Restore Bun package cache
      id: bun-cache
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-

    - name: Install locked dependencies
      shell: bash
      run: bun install --frozen-lockfile --prefer-offline

    - name: Save Bun package cache
      if: ${{ steps.bun-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}

    - name: Install Chromium
      if: ${{ inputs.playwright == 'true' }}
      shell: bash
      run: bunx playwright install --with-deps chromium
