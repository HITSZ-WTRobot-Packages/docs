name: Setup documentation toolchain
description: Install the pinned Bun dependencies, Doxygen, and optional Chromium runtime.

inputs:
  playwright:
    description: Install Chromium and its operating-system dependencies.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - name: Install locked dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install pinned Doxygen
      shell: bash
      env:
        DOXYGEN_VERSION: 1.16.1
        DOXYGEN_SHA256: a56f885d37e3aae08a99f638d17bbb381224c03a878d9e2dda4f9fa4baf1d8bd
      run: |
        set -euo pipefail
        test "${DOXYGEN_VERSION}" = "$(tr -d '[:space:]' < .doxygen-version)"
        archive_path="${RUNNER_TEMP}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
        curl --fail --location --proto '=https' --tlsv1.2 \
          --output "${archive_path}" \
          "https://github.com/doxygen/doxygen/releases/download/Release_1_16_1/doxygen-1.16.1.linux.bin.tar.gz"
        echo "${DOXYGEN_SHA256}  ${archive_path}" | sha256sum --check --strict
        tar --extract --gzip --file "${archive_path}" --directory "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/doxygen-${DOXYGEN_VERSION}/bin" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/doxygen-${DOXYGEN_VERSION}/bin/doxygen" --version

    - name: Install Chromium
      if: ${{ inputs.playwright == 'true' }}
      shell: bash
      run: bunx playwright install --with-deps chromium
