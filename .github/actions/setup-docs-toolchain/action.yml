name: Setup documentation toolchain
description: Install the pinned Bun dependencies and optional Chromium runtime.

inputs:
  playwright:
    description: Install Chromium and its operating-system dependencies.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - name: Install locked dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install Chromium
      if: ${{ inputs.playwright == 'true' }}
      shell: bash
      run: bunx playwright install --with-deps chromium
