name: Synchronize snapshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Synchronization scope.
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all
          - module
      module:
        description: Indexed module name; required only in module mode.
        required: false
        type: string
      dry_run:
        description: Validate upstream snapshots without writing sources/.
        required: true
        default: true
        type: boolean
      commit:
        description: Commit synchronized source changes to the default branch.
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types:
      - sync-snapshots

permissions:
  contents: read

concurrency:
  group: package-snapshot-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up documentation toolchain
        uses: ./.github/actions/setup-docs-toolchain

      - name: Read locked Doxygen version
        id: doxygen-version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .doxygen-version)" >> "${GITHUB_OUTPUT}"

      - name: Restore Doxygen cache
        id: doxygen-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/wtr-doxygen/${{ steps.doxygen-version.outputs.version }}
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-doxygen-${{ steps.doxygen-version.outputs.version
            }}-b5b80f5a60852f72d3c33f47fee9ddfb84a25929

      - name: Set up Doxygen
        if: ${{ steps.doxygen-cache.outputs.cache-hit != 'true' }}
        uses: ssciwr/doxygen-install@b5b80f5a60852f72d3c33f47fee9ddfb84a25929 # v2
        with:
          version: ${{ steps.doxygen-version.outputs.version }}

      - name: Populate Doxygen cache
        if: ${{ steps.doxygen-cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          DOXYGEN_VERSION: ${{ steps.doxygen-version.outputs.version }}
        run: |
          set -euo pipefail
          cache_bin="${HOME}/.cache/wtr-doxygen/${DOXYGEN_VERSION}/bin"
          mkdir -p "${cache_bin}"
          cp "$(command -v doxygen)" "${cache_bin}/doxygen"
          chmod +x "${cache_bin}/doxygen"

      - name: Save Doxygen cache
        if: ${{ steps.doxygen-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/wtr-doxygen/${{ steps.doxygen-version.outputs.version }}
          key: ${{ steps.doxygen-cache.outputs.cache-primary-key }}

      - name: Add cached Doxygen to PATH
        shell: bash
        env:
          DOXYGEN_VERSION: ${{ steps.doxygen-version.outputs.version }}
        run: echo "${HOME}/.cache/wtr-doxygen/${DOXYGEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Synchronize through the repository CLI
        id: request
        run: bun run sync:action

      - name: Commit synchronized snapshots
        if: ${{ steps.request.outputs.commit == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- sources/
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sources): synchronize package snapshots [snapshot-sync]"
          gh auth setup-git
          git push origin "HEAD:${TARGET_BRANCH}"
