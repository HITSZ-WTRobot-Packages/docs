name: Synchronize snapshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Synchronization scope.
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all
          - module
      module:
        description: Allowlisted module name; required only in module mode.
        required: false
        type: string
      dry_run:
        description: Validate upstream snapshots without writing sources/.
        required: true
        default: true
        type: boolean
      commit:
        description: Commit validated source changes to the default branch.
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types:
      - sync-snapshots

permissions:
  contents: write

concurrency:
  group: package-snapshot-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up documentation toolchain
        uses: ./.github/actions/setup-docs-toolchain

      - name: Read locked Doxygen version
        id: doxygen-version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .doxygen-version)" >> "${GITHUB_OUTPUT}"

      - name: Set up Doxygen
        uses: ssciwr/doxygen-install@b5b80f5a60852f72d3c33f47fee9ddfb84a25929 # v2
        with:
          version: ${{ steps.doxygen-version.outputs.version }}

      - name: Synchronize through the repository CLI
        id: request
        run: bun run sync:action

      - name: Detect snapshot changes
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot_status="$(git status --porcelain --untracked-files=all -- sources/)"
          if [[ -z "${snapshot_status}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "${snapshot_status}"
          fi

      - name: Run offline quality gate
        if: ${{ steps.snapshot.outputs.changed == 'true' }}
        run: bun run check

      - name: Verify offline generators
        if: ${{ steps.snapshot.outputs.changed == 'true' }}
        run: bun run generate

      - name: Build validation site
        if: ${{ steps.snapshot.outputs.changed == 'true' }}
        env:
          SITE_URL: https://snapshot-validation.example.invalid
          BASE_PATH: /products/wtr/docs/
        run: bun run build

      - name: Check validation artifacts
        if: ${{ steps.snapshot.outputs.changed == 'true' }}
        env:
          SITE_URL: https://snapshot-validation.example.invalid
          BASE_PATH: /products/wtr/docs/
        run: bun run check:artifacts

      - name: Check validation links
        if: ${{ steps.snapshot.outputs.changed == 'true' }}
        env:
          SITE_URL: https://snapshot-validation.example.invalid
          BASE_PATH: /products/wtr/docs/
        run: bun run check:links

      - name: Install Chromium for snapshot validation
        if: ${{ steps.snapshot.outputs.changed == 'true' }}
        run: bunx playwright install --with-deps chromium

      - name: Run browser and accessibility checks
        if: ${{ steps.snapshot.outputs.changed == 'true' }}
        env:
          SITE_URL: https://snapshot-validation.example.invalid
          BASE_PATH: /products/wtr/docs/
          PLAYWRIGHT_REUSE_ARTIFACT: "1"
        run: bun run test:e2e

      - name: Commit validated snapshots
        if: >-
          steps.snapshot.outputs.changed == 'true' && steps.request.outputs.commit == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- sources/
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sources): synchronize package snapshots [snapshot-sync]"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Report validated uncommitted changes
        if: >-
          steps.snapshot.outputs.changed == 'true' && steps.request.outputs.commit != 'true'
        shell: bash
        run: |
          echo "Validated snapshot changes were not committed by request." >> "${GITHUB_STEP_SUMMARY}"
          git diff --stat -- sources/

      - name: Report no changes
        if: ${{ steps.snapshot.outputs.changed != 'true' }}
        shell: bash
        run: echo "Synchronization produced no source changes." >> "${GITHUB_STEP_SUMMARY}"
